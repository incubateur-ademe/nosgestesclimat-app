# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    # Look for `package.json` and `lock` files in the `root` directory
    directory: "/"
    cooldown:
      default-days: 7
    # Check the npm registry for updates every week
    schedule:
      interval: "weekly"
    # A grouped PR counts as one, majors get their own slots.
    open-pull-requests-limit: 10
    rebase-strategy: auto
    ignore:
      # From 1.10.2 the package ships .mjs only but still exports .js paths:
      # TypeScript and Node cannot resolve `@publicodes/tools/migration`.
      - dependency-name: "@publicodes/tools"
      # Model bumps rename rules, which surface as `DottedName` type errors:
      # .github/workflows/common:update-model.yaml owns those.
      - dependency-name: "@incubateur-ademe/nosgestesclimat"
    # Minor and patch bumps land in a single PR; majors keep their own.
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
        # `packages/core/src/test-utils/db.ts` patches pglite internals, and pglite
        # is 0.x: its minors are breaking. Bump these two by hand.
        exclude-patterns:
          - "@electric-sql/pglite"
          - "pglite-prisma-adapter"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    # Workflow files stored in the default location of `.github/workflows`
    # You don't need to specify `/.github/workflows` for `directory`. You can use `directory: "/"`.
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: auto
    groups:
      github-actions:
        patterns:
          - "*"
