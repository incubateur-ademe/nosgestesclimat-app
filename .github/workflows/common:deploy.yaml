name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-server-preprod:
    name: Deploy server to preprod
    runs-on: ubuntu-latest
    environment: Preprod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy to Scalingo
        uses: ./.github/actions/deploy-scalingo
        with:
          fgp-deploy-token: ${{ secrets.FGP_DEPLOY_TOKEN }}
          fgp-deploy-url: ${{ vars.FGP_DEPLOY_URL }}
          scalingo-app-name: ${{ vars.SCALINGO_SERVER_APP_NAME }}
          git-ref: main

  deploy-site-preprod:
    name: Deploy site to preprod
    needs: deploy-server-preprod
    runs-on: ubuntu-latest
    environment: Preprod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Deploy to Scalingo
        uses: ./.github/actions/deploy-scalingo
        with:
          fgp-deploy-token: ${{ secrets.FGP_DEPLOY_TOKEN }}
          fgp-deploy-url: ${{ vars.FGP_DEPLOY_URL }}
          scalingo-app-name: ${{ vars.SCALINGO_SITE_APP_NAME }}
          git-ref: main

  e2e-preprod:
    name: Tests on preprod (${{ matrix.project }})
    needs: [deploy-site-preprod, deploy-server-preprod]
    environment:
      name: Test E2E
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Chrome
            browser: chromium
          - project: Firefox
            browser: firefox
          # - project: Mobile Safari
          #   browser: webkit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/e2e
    env:
      NEXT_PUBLIC_SITE_URL: 'https://preprod.nosgestesclimat.fr'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Playwright and App
        uses: ./.github/actions/setup-playwright
        with:
          browser: ${{ matrix.browser }}

      # The `global setup` Playwright project runs in Desktop Chrome.
      - name: Install Chromium for E2E state generation
        if: ${{ matrix.browser != 'chromium' }}
        run: pnpm playwright install chromium

      - name: Run E2E tests (${{ matrix.project }})
        env:
          E2E_MAILBOX: brevo
          FGP_BREVO_READONLY_URL: ${{ vars.FGP_BREVO_READONLY_URL }}
          FGP_BREVO_READONLY_TOKEN: ${{ secrets.FGP_BREVO_READONLY_TOKEN }}
        run: pnpm playwright test --project="${{ matrix.project }}"

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: blob-report-${{ matrix.project }}
          path: apps/e2e/blob-report
          retention-days: 1

  e2e-preprod-merge-reports:
    name: Merge E2E reports
    # Skip if e2e-preprod was skipped (preprod deploy failed).
    if: ${{ !cancelled() && needs.e2e-preprod.result != 'skipped' }}
    needs: [e2e-preprod]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/e2e
    env:
      NEXT_PUBLIC_SITE_URL: 'https://preprod.nosgestesclimat.fr'
    steps:
      - uses: actions/checkout@v6

      - name: Download blob reports
        uses: actions/download-artifact@v6
        with:
          path: apps/e2e/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML Report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 30

  deploy-server-prod:
    name: Deploy server to prod
    needs: e2e-preprod
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy to Scalingo
        uses: ./.github/actions/deploy-scalingo
        with:
          fgp-deploy-token: ${{ secrets.FGP_DEPLOY_TOKEN }}
          fgp-deploy-url: ${{ vars.FGP_DEPLOY_URL }}
          scalingo-app-name: ${{ vars.SCALINGO_SERVER_APP_NAME }}
          git-ref: main

  deploy-site-prod:
    name: Deploy site to prod
    needs: deploy-server-prod
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy to Scalingo
        uses: ./.github/actions/deploy-scalingo
        with:
          fgp-deploy-token: ${{ secrets.FGP_DEPLOY_TOKEN }}
          fgp-deploy-url: ${{ vars.FGP_DEPLOY_URL }}
          scalingo-app-name: ${{ vars.SCALINGO_SITE_APP_NAME }}
          git-ref: main
