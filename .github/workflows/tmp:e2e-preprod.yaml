# TEMPORARY: checks the preprod suite from PR #2166. Remove before merging.
name: E2E preprod (temporary)

on: [pull_request]

permissions:
  contents: read

jobs:
  e2e-preprod:
    name: Tests on preprod (${{ matrix.project }})
    environment:
      name: Test E2E
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Chrome
            browser: chromium
          - project: Firefox
            browser: firefox
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/e2e
    env:
      NEXT_PUBLIC_SITE_URL: 'https://preprod.nosgestesclimat.fr'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Playwright and App
        uses: ./.github/actions/setup-playwright
        with:
          browser: ${{ matrix.browser }}

      - name: Run E2E tests (${{ matrix.project }})
        env:
          E2E_MAILBOX_MAILISK_API_KEY: ${{ secrets.E2E_MAILBOX_MAILISK_API_KEY }}
          E2E_MAILBOX_MAILISK_NAMESPACE: ${{ vars.E2E_MAILBOX_MAILISK_NAMESPACE }}
        run: pnpm playwright test -c playwright.preprod.config.ts --project="Preprod ${{ matrix.project }}"

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: preprod-blob-report-${{ matrix.project }}
          path: apps/e2e/blob-report
          retention-days: 1

  # Which of the emails reached the inbox? Local parts and dates only: subjects
  # hold the verification codes, and these logs are public.
  mailisk-inbox:
    name: Mailisk inbox
    needs: e2e-preprod
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: Test E2E
      deployment: false
    steps:
      - name: List received emails
        env:
          API_KEY: ${{ secrets.E2E_MAILBOX_MAILISK_API_KEY }}
          NAMESPACE: ${{ vars.E2E_MAILBOX_MAILISK_NAMESPACE }}
        run: |
          from=$(( $(date +%s) - 4 * 3600 ))
          status=$(curl -s -o inbox.json -w '%{http_code}' -H "X-Api-Key: $API_KEY" \
            "https://api.mailisk.com/api/emails/$NAMESPACE/inbox?limit=100&from_timestamp=$from")
          echo "HTTP $status"
          jq -r '"total_count: \(.total_count)", "keys: \(keys)"' inbox.json
          jq -r '.data[]? | "\(.received_date) \([.to[]?.address | split("@")[0]] | join(","))"' inbox.json | sort
