name: Quality Control

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-control:
    name: Quality Control job
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch target branch to detect changed workspaces
        run: git fetch origin main:refs/remotes/origin/main

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache ESLint
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.cache/eslint
            apps/*/node_modules/.cache/eslint
            packages/*/node_modules/.cache/eslint
          key: ${{ runner.os }}-eslint-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('eslint.config.js') }}

      - name: Cache TypeScript
        uses: actions/cache@v5
        with:
          path: |
            tsconfig.tsbuildinfo
            apps/*/tsconfig.tsbuildinfo
            packages/*/tsconfig.tsbuildinfo
          key: ${{ runner.os }}-tsc-${{ hashFiles('apps/*/tsconfig.json', 'packages/*/tsconfig.json') }}

      # `site generate` runs `next typegen`, which loads `next.config.ts` and
      # therefore the server env contract: without these values the contract
      # throws, and `next typegen` writes neither `next-env.d.ts` nor the route
      # types, so `PageProps` and `LayoutProps` go missing at typecheck time.
      - name: Generate types, db client…
        run: |
          set -a
          source .github/e2e-local.env
          source apps/site/.env.e2e
          set +a
          pnpm --filter "...[origin/main]..." generate

      - name: Lint
        run: pnpm --filter "[origin/main]" lint

      - name: Typecheck
        run: pnpm --filter "...[origin/main]" typecheck

      # The worker runs these TypeScript sources without a bundler, through
      # Node's strip-only loader: a parameter property, an enum or a namespace
      # anywhere on its import graph stops it from starting. Nothing else in
      # CI loads that graph.
      - name: Load the worker's sources under strip-only TypeScript
        run: pnpm --filter "...[origin/main]" --if-present run check:worker

      - name: Run unit and integration tests
        run: pnpm --filter "...[origin/main]" test
