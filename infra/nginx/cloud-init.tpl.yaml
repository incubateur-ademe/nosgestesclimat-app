#cloud-config
# ⚠️  Ne pas éditer directement. Généré par ./generate-cloud-init.sh
#     Template : cloud-init.tpl.yaml

package_update: true
package_upgrade: true

packages:
  - nginx
  - certbot
  - python3-certbot-nginx
  - gettext-base
  - jq

write_files:
  - path: /etc/nginx/deploy.env
    permissions: '0600'
    content: |
      DOMAIN=__DOMAIN__
      UPSTREAM=__UPSTREAM__
      ENVIRONMENT=__ENVIRONMENT__
      REPO=__REPO__
      TEMPLATE_REF=__TEMPLATE_REF__

  - path: /etc/systemd/system/nginx.service.d/override.conf
    permissions: '0644'
    content: |
      [Unit]
      StartLimitIntervalSec=3600
      StartLimitBurst=360

      [Service]
      Restart=on-failure
      RestartSec=10s
      TimeoutStartSec=60s

  - path: /etc/otelcol-contrib/otelcol-contrib.env
    permissions: '0600'
    content: |
      POSTHOG_PROJECT_TOKEN=__POSTHOG_PROJECT_TOKEN__
      ENVIRONMENT=__ENVIRONMENT__

  - path: /etc/systemd/system/otelcol-contrib.service.d/override.conf
    permissions: '0644'
    content: |
      [Service]
      EnvironmentFile=/etc/otelcol-contrib/otelcol-contrib.env
      Restart=on-failure
      RestartSec=10s

  # Rétention réduite (2 jours au lieu de 14 par défaut) : les logs sont déjà
  # expédiés vers PostHog, et error.log contient encore des IP (format nginx
  # non modifiable) — on limite leur présence sur disque.
  - path: /etc/logrotate.d/nginx
    permissions: '0644'
    content: |
      /var/log/nginx/*.log {
          daily
          missingok
          rotate 2
          compress
          delaycompress
          notifempty
          create 0640 www-data adm
          sharedscripts
          postrotate
              invoke-rc.d nginx rotate >/dev/null 2>&1
          endscript
      }

runcmd:
  - mkdir -p /var/cache/nginx /var/lib/nginx-config
  - chown -R www-data:www-data /var/cache/nginx
  - ln -sf /etc/nginx/sites-available/nosgestesclimat /etc/nginx/sites-enabled/
  - rm -f /etc/nginx/sites-enabled/default
  - |
    ufw allow 22/tcp
    ufw allow 80/tcp
    ufw allow 443/tcp
    ufw --force enable

  # ── OpenTelemetry Collector (nginx → PostHog Logs) ──────────────────────
  # Version épinglée via __OTELCOL_VERSION__ : pas de maj surprise — on bump
  # volontairement la version dans generate-cloud-init.sh.
  - |
    set -euo pipefail
    VER="__OTELCOL_VERSION__"
    BASE="https://github.com/open-telemetry/opentelemetry-collector-releases"
    DEB="${BASE}/releases/download/v${VER}/"\
    "otelcol-contrib_${VER}_linux_amd64.deb"
    curl -fsSL --retry 3 -o /tmp/otelcol-contrib.deb "$DEB"
    curl -fsSL --retry 3 -o /tmp/otelcol-contrib.deb.sha256 "$DEB.sha256"
    EXPECTED=$(awk '{print $1}' /tmp/otelcol-contrib.deb.sha256)
    ACTUAL=$(sha256sum /tmp/otelcol-contrib.deb | awk '{print $1}')
    test "$EXPECTED" = "$ACTUAL"
    dpkg -i /tmp/otelcol-contrib.deb
    rm -f /tmp/otelcol-contrib.deb /tmp/otelcol-contrib.deb.sha256
  - mkdir -p /var/lib/otelcol-contrib
  - chown -R otelcol-contrib:otelcol-contrib /var/lib/otelcol-contrib
  # Lecture de /var/log/nginx/*.log (groupe `adm` sur Ubuntu/Debian).
  - usermod -aG adm otelcol-contrib

  # ── Pull des fichiers depuis GitHub (conf nginx, config collector, units) ─
  - |
    GH_RAW="raw.githubusercontent.com"
    RAW="https://${GH_RAW}/__REPO__/refs/heads/__TEMPLATE_REF__/infra/nginx"
    curl -fsSL "$RAW/otelcol-config.yaml" \
      -o /etc/otelcol-contrib/config.yaml
    curl -fsSL "$RAW/pull-config.sh" \
      -o /usr/local/bin/nginx-config-pull.sh
    chmod +x /usr/local/bin/nginx-config-pull.sh
    curl -fsSL "$RAW/nginx-config-pull.service" \
      -o /etc/systemd/system/nginx-config-pull.service
    curl -fsSL "$RAW/nginx-config-pull.timer" \
      -o /etc/systemd/system/nginx-config-pull.timer
  - systemctl daemon-reload
  - systemctl enable --now otelcol-contrib
  - systemctl enable --now nginx-config-pull.timer
  - /usr/local/bin/nginx-config-pull.sh
  - echo "✅ Nginx config pulled. Nginx à l'arrêt — certificat SSL manquant."
  - echo "   certbot certonly --manual --preferred-challenges dns"
  - echo "   -d __DOMAIN__ -d www.__DOMAIN__"
