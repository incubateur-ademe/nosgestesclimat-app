# ----------------------------------------------------------------------------
# OpenTelemetry Collector — nginx → PostHog Logs
#
# Taille /var/log/nginx/{access,error}.log et les exporte vers PostHog Logs
# (endpoint OTLP HTTP). Déployé sur l'instance Scaleway par cloud-init,
# service systemd `otelcol-contrib` (user `otelcol-contrib`).
#
# Résilience :
#   - `file_storage` (offsets de lecture) → reprise exacte après restart,
#     ni trou ni doublon lors des rotations de logs.
#   - `sending_queue.storage` (file-queue) + `retry_on_failure` → si PostHog ou
#     le réseau est indisponible, les logs sont mis en attente sur disque et
#     réexpédiés avec backoff (aucune perte, nginx n'est jamais impacté).
#
# Les variables ${env:...} sont résolues par le collecteur au démarrage depuis
# son environnement, chargé par systemd via
# /etc/otelcol-contrib/otelcol-contrib.env (cf. cloud-init.tpl.yaml).
# ----------------------------------------------------------------------------

extensions:
  health_check:
  file_storage:
    directory: /var/lib/otelcol-contrib

receivers:
  # access.log : JSON (voir `log_format json_combined` dans nginx.conf.tpl).
  filelog/access:
    include: [/var/log/nginx/access.log]
    start_at: end
    include_file_path: true
    storage: file_storage
    operators:
      # Emails masqués sur la ligne brute, avant parsing : une seule règle
      # couvre tous les champs (url.*, user_agent, …) sans les énumérer.
      - type: regex_replace
        field: body
        regex: '[\w.+-]+@[\w.-]+'
        replace_with: '[email]'
      - type: json_parser
        parse_to: attributes
        timestamp:
          parse_from: attributes.time_iso8601
          layout_type: strptime
          # %j = offset ±HH:MM (deux-points), comme $time_iso8601.
          layout: '%Y-%m-%dT%H:%M:%S%j'
        # request_id (32 hex, généré par nginx) → trace_id du log : convention
        # OTel pour corréler avec les traces/logs partageant le X-Request-ID.
        trace:
          trace_id:
            parse_from: attributes.request_id
      # `$server_protocol` brut ("HTTP/1.1") → semconv ("1.1", "2", "3").
      - type: regex_replace
        field: attributes["network.protocol.version"]
        regex: '^HTTP/(1\.[01]|[23]).*'
        # Le collecteur interprète `${...}` comme variable d'env → `$$` échappe.
        replace_with: '$${1}'
      # Nettoyage à la source : tout champ déjà exploité ailleurs est supprimé
      # pour alléger le volume envoyé à PostHog.
      - type: remove
        field: body
      # `time_iso8601` a posé le timestamp du record.
      - type: remove
        field: attributes.time_iso8601
      # `request_id` a posé le trace_id du record.
      - type: remove
        field: attributes.request_id

  # error.log : format texte d'nginx OSS. Le JSON (`error_log json`) est
  # réservé à NGINX Plus. Le préfixe est stable :
  #   YYYY/MM/DD HH:MM:SS [level] pid#tid: message
  #   ex. 2024/09/10 11:16:00 [error] 1234#1234: *567 upstream timed out
  # La regex extrait date/heure + niveau ; le message reste en `body` où les
  # Emails masqués ci-dessous ; IP/referrer masqués par `transform/error`.
  filelog/error:
    include: [/var/log/nginx/error.log]
    start_at: end
    include_file_path: true
    storage: file_storage
    operators:
      # Emails masqués sur la ligne brute, avant parsing (cf. access).
      - type: regex_replace
        field: body
        regex: '[\w.+-]+@[\w.-]+'
        replace_with: '[email]'
      # Préfixe fixe : `time [level] pid#tid: *connection`.
      - type: regex_parser
        regex: '^(?P<time>\S+ \S+) \[(?P<sev>[a-z]+)\] (?P<pid>\d+)#(?P<tid>\d+): \*(?P<connection>\d+)' # yamllint disable-line rule:line-length
        timestamp:
          parse_from: attributes.time
          layout_type: strptime
          layout: '%Y/%m/%d %H:%M:%S'
        severity:
          parse_from: attributes.sev
          mapping:
            debug: debug
            info: info
            notice: info
            warn: warn
            error: error
            crit: fatal
            alert: fatal
            emerg: fatal
      # Contexte de requête (optionnel selon le type d'erreur). On ancre sur les
      # libellés (pas la position). `client`/`referrer` exclus : PII.
      - type: regex_parser
        regex: 'server: (?P<server>[^,]+)'
        on_error: send
      - type: regex_parser
        regex: 'request: "(?P<request>[^"]*)"'
        on_error: send
      - type: regex_parser
        regex: 'upstream: "(?P<upstream>[^"]*)"'
        on_error: send
      - type: regex_parser
        regex: 'host: "(?P<host>[^"]*)"'
        on_error: send

processors:
  resource/nginx:
    attributes:
      - key: service.name
        value: nginx
        action: upsert
      - key: deployment.environment
        value: ${env:ENVIRONMENT}
        action: upsert

  batch:
    send_batch_size: 1000
    timeout: 5s

  # access.log : ni IP client ni referrer (absents du log_format) ; le body
  # (JSON brut) est supprimé au receiver et les emails y sont masqués avant
  # parsing. Il ne reste ici que le type d'événement.
  transform/access:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - 'set(log.event_name, "nginx.access")'

  # error.log : le body (message brut, conservé) porte l'IP client et le
  # referrer à masquer (les emails sont déjà traités par le receiver).
  transform/error:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - 'set(log.event_name, "nginx.error")'
          - 'replace_pattern(body, "client:? [0-9a-fA-F:.]+", "client [ip]")'
          - 'replace_pattern(body, "referrer: \"([^\"?]*)\\?[^\"]*\"", "referrer: \"$$1\"")' # yamllint disable-line rule:line-length

exporters:
  otlphttp/posthog:
    # Base OTLP : l'exporter ajoute /v1/logs. EU (US : us.i.posthog.com/i)
    endpoint: https://eu.i.posthog.com/i
    headers:
      Authorization: Bearer ${env:POSTHOG_PROJECT_TOKEN}
    # File d'attente (activée par défaut) : on ne précise que la persistance
    # sur disque, pour survivre à un restart du collecteur. Retry (5s → 30s,
    # 5 min max), 10 consommateurs et 1000 lots (~1 h 20 de tampon) : défauts.
    sending_queue:
      storage: file_storage

service:
  extensions: [health_check, file_storage]
  pipelines:
    logs/access:
      receivers: [filelog/access]
      processors: [resource/nginx, transform/access, batch]
      exporters: [otlphttp/posthog]
    logs/error:
      receivers: [filelog/error]
      processors: [resource/nginx, transform/error, batch]
      exporters: [otlphttp/posthog]
